name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  schedule:
    - cron: "26 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
            timeout_minutes: 30
            config_file: ./.github/codeql/codeql-config.yml
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
            timeout_minutes: 30
            config_file: ./.github/codeql/codeql-config.yml
          - language: python
            build-mode: none
            runner: ubuntu-latest
            timeout_minutes: 30
            config_file: ./.github/codeql/codeql-config.yml
          - language: java-kotlin
            # The app has Java only. Analyze its owned source without
            # compiling Capacitor's third-party Java/Kotlin plugin sources.
            build-mode: none
            runner: ubuntu-latest
            timeout_minutes: 30
            config_file: ./.github/codeql/codeql-java-config.yml
          - language: swift
            build-mode: manual
            runner: macos-latest
            # SwiftPM dependency resolution can exceed the default CodeQL job
            # window on a cold macOS runner.
            timeout_minutes: 60
            config_file: ./.github/codeql/codeql-config.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js for native dependencies
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install native dependencies
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        run: yarn install --frozen-lockfile

      # Capacitor excludes generated web assets from git. Recreate them before
      # xcodebuild so the iOS target's public resource can be copied.
      - name: Prepare iOS app assets
        if: matrix.language == 'swift'
        run: yarn build:ios

      - name: Resolve iOS Swift packages
        if: matrix.language == 'swift'
        run: >-
          xcodebuild -resolvePackageDependencies
          -project "ios/App/Ferry FYI.xcodeproj"
          -scheme "Ferry FYI"

      - name: Use Java for Android analysis
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: matrix.language == 'java-kotlin'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config_file }}

      - name: Build Android code
        if: matrix.language == 'java-kotlin' && matrix.build-mode == 'manual'
        run: |
          yarn build:android:ci
          (
            cd android
            ./gradlew --no-daemon :app:assembleDebug
          )

      - name: Build iOS code
        if: matrix.language == 'swift'
        run: >-
          xcodebuild
          -project "ios/App/Ferry FYI.xcodeproj"
          -scheme "Ferry FYI"
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
