name: Runtime quality

on:
  schedule:
    - cron: "23 15 * * 2"
  workflow_dispatch:
    inputs:
      run_performance:
        description: Run the canonical audited baseline/candidate benchmark
        required: true
        default: false
        type: boolean
      performance_baseline:
        description: Audited immutable baseline commit (defaults to candidate parent)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-quality
  cancel-in-progress: true

jobs:
  public-contracts:
    name: Production semantic smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check public contracts
        env:
          BASE_URL: https://ferry.fyi
        run: node scripts/smoke-public-contracts.mjs --phase final --output public-contract-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-contract-receipt-${{ github.run_id }}
          path: public-contract-receipt.json
          if-no-files-found: error
          retention-days: 30

  accessibility-and-performance:
    name: Variable browser quality
    runs-on: ubuntu-latest
    # support production server imports in the SSR fixture
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ferryfyi
          POSTGRES_PASSWORD: testing
          POSTGRES_USER: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ferryfyi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH0_CLIENT_AUDIENCE: https://ferry.fyi/api
      AUTH0_DOMAIN: tenant.example.test
      BASE_URL: https://ferry.fyi
      DATABASE_URL: postgres://test:testing@localhost:5432/ferryfyi
      PGSSLMODE: disable
      SENTRY_AUTH_TOKEN: ""
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn build:e2e:ssr
      - run: yarn db:migrate
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e:accessibility
      - run: yarn budget:client

  performance-characterization:
    name: Canonical browser performance characterization
    if: github.event_name == 'workflow_dispatch' && inputs.run_performance
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - name: Run canonical audited comparison
        env:
          REQUESTED_BASELINE: ${{ inputs.performance_baseline }}
        run: |
          set -euo pipefail
          BASELINE="${REQUESTED_BASELINE:-${GITHUB_SHA}^}"
          yarn benchmark:browser-runtime -- \
            --baseline "${BASELINE}" \
            --candidate "${GITHUB_SHA}" \
            --receipt 0 \
            --output runtime-browser-results
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-${{ github.run_id }}
          path: runtime-browser-results
          if-no-files-found: error
          retention-days: 30
