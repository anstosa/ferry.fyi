name: Deploy AWS Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    name: Validate, build, and deploy
    runs-on: ubuntu-latest
    # keep branch-scoped oidc subject
    if: github.ref == 'refs/heads/production'
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ferryfyi
          POSTGRES_PASSWORD: testing
          POSTGRES_USER: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ferryfyi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH0_CLIENT_AUDIENCE: ${{ vars.AUTH0_CLIENT_AUDIENCE }}
      AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_REDIRECT: ${{ vars.AUTH0_CLIENT_REDIRECT }}
      AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
      AW_TAG_ID: ${{ vars.AW_TAG_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BASE_URL: ${{ vars.BASE_URL }}
      DETECTOR_CONTEXT: ${{ vars.DETECTOR_CONTEXT || 'detector-runtime' }}
      DETECTOR_DOCKERFILE: ${{ vars.DETECTOR_DOCKERFILE || 'detector-runtime/Dockerfile' }}
      DETECTOR_ECR_REPOSITORY_URL: ${{ vars.DETECTOR_ECR_REPOSITORY_URL }}
      DATABASE_URL: postgres://test:testing@localhost:5432/ferryfyi
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
      FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
      GOOGLE_ANALYTICS: ${{ vars.GOOGLE_ANALYTICS }}
      GTM_CONTAINER_ID: ${{ vars.GTM_CONTAINER_ID }}
      HEROKU_RELEASE_VERSION: ${{ github.sha }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
      PGSSLMODE: disable
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      TZ: America/Los_Angeles

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Build application
        env:
          SENTRY_AUTH_TOKEN: ""
        run: yarn build

      - name: Prepare test database
        run: yarn db:migrate

      - name: Unit and integration tests
        run: yarn test

      - name: Validate built public surfaces and budgets
        run: |
          yarn budget:client
          yarn test -- tests/server/seo.test.ts tests/server/server-security.test.ts tests/server/openapi-contract.test.ts tests/server/security-txt.test.ts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Verify production Firebase identity and report configuration
        env:
          WEB_TASK_DEFINITION_FAMILY: ${{ vars.ECS_WEB_TASK_DEFINITION_FAMILY }}
        run: |
          set -euo pipefail
          TASK_DEFINITION="$(aws ecs describe-task-definition --task-definition "${WEB_TASK_DEFINITION_FAMILY}")"
          REPORT_VALUE_FROM="$(jq -r '.taskDefinition.containerDefinitions[] | select(.name == "web") | .secrets[] | select(.name == "REPORT_BASE_URL") | .valueFrom' <<< "${TASK_DEFINITION}")"
          PROJECT_VALUE_FROM="$(jq -r '.taskDefinition.containerDefinitions[] | select(.name == "web") | .secrets[] | select(.name == "FIREBASE_PROJECT_ID") | .valueFrom' <<< "${TASK_DEFINITION}")"
          SERVICE_ACCOUNT_VALUE_FROM="$(jq -r '.taskDefinition.containerDefinitions[] | select(.name == "web") | .secrets[] | select(.name == "FIREBASE_SERVICE_ACCOUNT") | .valueFrom' <<< "${TASK_DEFINITION}")"
          if [[ -z "${REPORT_VALUE_FROM}" || "${REPORT_VALUE_FROM}" == "null" ]]; then
            echo "REPORT_BASE_URL is missing from the active task-definition family" >&2
            exit 1
          fi
          PROJECT_SECRET_ARN="${PROJECT_VALUE_FROM%:FIREBASE_PROJECT_ID::}"
          SERVICE_ACCOUNT_SECRET_ARN="${SERVICE_ACCOUNT_VALUE_FROM%:FIREBASE_SERVICE_ACCOUNT::}"
          if [[ -z "${PROJECT_VALUE_FROM}" || "${PROJECT_VALUE_FROM}" == "null" || -z "${SERVICE_ACCOUNT_VALUE_FROM}" || "${SERVICE_ACCOUNT_VALUE_FROM}" == "null" || "${PROJECT_SECRET_ARN}" != "${SERVICE_ACCOUNT_SECRET_ARN}" ]]; then
            echo "Firebase runtime identity inputs are missing or come from different secrets" >&2
            exit 1
          fi
          grep -F -- "${FIREBASE_PROJECT_ID}" dist/client/service-worker.js > /dev/null

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ""
        run: |
          # fail on shell mistakes
          set -euo pipefail
          # derive immutable image tags
          IMAGE_URI="${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          LATEST_IMAGE_URI="${ECR_REPOSITORY_URL}:latest"
          # build and push the ARM64 production image
          docker buildx build \
            --platform linux/arm64 \
            --build-arg AUTH0_CLIENT_AUDIENCE="${AUTH0_CLIENT_AUDIENCE}" \
            --build-arg AUTH0_CLIENT_ID="${AUTH0_CLIENT_ID}" \
            --build-arg AUTH0_CLIENT_REDIRECT="${AUTH0_CLIENT_REDIRECT}" \
            --build-arg AUTH0_DOMAIN="${AUTH0_DOMAIN}" \
            --build-arg AW_TAG_ID="${AW_TAG_ID}" \
            --build-arg BASE_URL="${BASE_URL}" \
            --build-arg FIREBASE_API_KEY="${FIREBASE_API_KEY}" \
            --build-arg FIREBASE_APP_ID="${FIREBASE_APP_ID}" \
            --build-arg FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --build-arg FIREBASE_SENDER_ID="${FIREBASE_SENDER_ID}" \
            --build-arg FIREBASE_VAPID_KEY="${FIREBASE_VAPID_KEY}" \
            --build-arg GOOGLE_ANALYTICS="${GOOGLE_ANALYTICS}" \
            --build-arg GTM_CONTAINER_ID="${GTM_CONTAINER_ID}" \
            --build-arg HEROKU_RELEASE_VERSION="${HEROKU_RELEASE_VERSION}" \
            --build-arg LOG_LEVEL="${LOG_LEVEL}" \
            --build-arg MAPBOX_ACCESS_TOKEN="${MAPBOX_ACCESS_TOKEN}" \
            --build-arg NODE_ENV="production" \
            --build-arg SENTRY_DSN="${SENTRY_DSN}" \
            -t "${IMAGE_URI}" \
            -t "${LATEST_IMAGE_URI}" \
            --push \
            .
          # expose immutable image
          echo "image=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Build and push detector image
        id: detector-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # fail on shell mistakes
          set -euo pipefail
          # require configured repository
          if [[ -z "${DETECTOR_ECR_REPOSITORY_URL}" ]]; then
            echo "DETECTOR_ECR_REPOSITORY_URL GitHub variable is required" >&2
            exit 1
          fi
          # require detector build context
          if [[ ! -d "${DETECTOR_CONTEXT}" ]]; then
            echo "Detector build context not found at ${DETECTOR_CONTEXT}" >&2
            exit 1
          fi
          # require detector build file
          if [[ ! -f "${DETECTOR_DOCKERFILE}" ]]; then
            echo "Detector Dockerfile not found at ${DETECTOR_DOCKERFILE}" >&2
            exit 1
          fi
          # derive immutable detector tags
          IMAGE_URI="${DETECTOR_ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          LATEST_IMAGE_URI="${DETECTOR_ECR_REPOSITORY_URL}:latest"
          # build cpu-only detector image
          docker build \
            -f "${DETECTOR_DOCKERFILE}" \
            -t "${IMAGE_URI}" \
            -t "${LATEST_IMAGE_URI}" \
            "${DETECTOR_CONTEXT}"
          # push rollbackable detector image
          docker push "${IMAGE_URI}"
          # push detector convenience tag
          docker push "${LATEST_IMAGE_URI}"
          # expose immutable detector image
          echo "image=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Render web task definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_WEB_TASK_DEFINITION_FAMILY }}
          container-name: web
          image: ${{ steps.image.outputs.image }}

      - name: Render migration task definition
        id: render-migration
        env:
          WEB_TASK_DEFINITION: ${{ steps.render-web.outputs.task-definition }}
        run: |
          # fail on shell mistakes
          set -euo pipefail
          # run migrations without the long-lived tunnel sidecar or web health check
          MIGRATION_TASK_DEFINITION="${RUNNER_TEMP}/migration-task-definition.json"
          jq '
            .containerDefinitions |= [
              .[]
              | select(.name == "web")
              | del(.healthCheck)
            ]
          ' "${WEB_TASK_DEFINITION}" > "${MIGRATION_TASK_DEFINITION}"
          # require exactly one standalone web container
          jq -e '
            (.containerDefinitions | length) == 1 and
            .containerDefinitions[0].name == "web" and
            (.containerDefinitions[0] | has("healthCheck") | not)
          ' "${MIGRATION_TASK_DEFINITION}" > /dev/null
          echo "task-definition=${MIGRATION_TASK_DEFINITION}" >> "${GITHUB_OUTPUT}"

      - name: Capture compatibility recovery evidence
        env:
          DETECTOR_SERVICE: ${{ vars.ECS_DETECTOR_SERVICE }}
          WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
        run: |
          set -euo pipefail
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${WEB_SERVICE}" "${DETECTOR_SERVICE}" \
            > current-services.json
          TASK_ARNS="$(aws ecs list-tasks --cluster "${ECS_CLUSTER}" --service-name "${WEB_SERVICE}" --query 'taskArns' --output json)"
          DETECTOR_TASK_ARNS="$(aws ecs list-tasks --cluster "${ECS_CLUSTER}" --service-name "${DETECTOR_SERVICE}" --query 'taskArns' --output json)"
          jq -n \
            --arg release "${GITHUB_SHA}" \
            --argjson services "$(jq '.services | map({serviceName, taskDefinition})' current-services.json)" \
            --argjson webTasks "${TASK_ARNS}" \
            --argjson detectorTasks "${DETECTOR_TASK_ARNS}" \
            --argjson migrations "$(git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}" -- server/migrations | jq -R -s 'split("\n") | map(select(length > 0))')" \
            '{schemaVersion: 1, release: $release, capturedAt: (now | todate), services: $services, taskArns: {web: $webTasks, detector: $detectorTasks}, migrationFiles: $migrations}' \
            > deployment-recovery.json
          if [[ "$(jq '.taskArns.web | length' deployment-recovery.json)" -gt 0 ]]; then
            aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks $(jq -r '.taskArns.web[]' deployment-recovery.json) > current-web-tasks.json
            jq '. + {webContainers: [inputs.tasks[].containers[] | {name, image, imageDigest}]}' deployment-recovery.json current-web-tasks.json > deployment-recovery.next.json
            mv deployment-recovery.next.json deployment-recovery.json
          fi
          if [[ "$(jq '.taskArns.detector | length' deployment-recovery.json)" -gt 0 ]]; then
            aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks $(jq -r '.taskArns.detector[]' deployment-recovery.json) > current-detector-tasks.json
            jq '. + {detectorContainers: [inputs.tasks[].containers[] | {name, image, imageDigest}]}' deployment-recovery.json current-detector-tasks.json > deployment-recovery.next.json
            mv deployment-recovery.next.json deployment-recovery.json
          fi

      - name: Retain compatibility recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-recovery-${{ github.sha }}
          path: deployment-recovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Run database migrations
        id: migrate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-migration.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          run-task: true
          wait-for-task-stopped: true
          wait-max-delay-seconds: 15
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ vars.ECS_TASK_SUBNETS }}
          run-task-security-groups: ${{ vars.ECS_TASK_SECURITY_GROUPS }}
          run-task-assign-public-IP: ENABLED
          run-task-started-by: github-actions-migrate-${{ github.run_id }}
          run-task-container-overrides: >-
            [{"name":"web","command":["yarn","db:migrate"]}]

      - name: Verify migration exit code
        env:
          MIGRATION_TASK_ARNS: ${{ steps.migrate.outputs.run-task-arn }}
        run: |
          # fail on shell mistakes
          set -euo pipefail
          # select migration task
          MIGRATION_TASK_ARN="$(jq -r '.[0]' <<< "${MIGRATION_TASK_ARNS}")"
          # require task output
          if [[ -z "${MIGRATION_TASK_ARN}" || "${MIGRATION_TASK_ARN}" == "null" ]]; then
            echo "Migration task ARN output was empty" >&2
            exit 1
          fi
          # fetch stopped task details
          aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${MIGRATION_TASK_ARN}" > migration-task.json
          # require successful migration container
          jq -e '.tasks[0].containers[] | select(.name == "web") | .exitCode == 0' migration-task.json

      - name: Deploy web service
        id: deploy-web
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: ${{ vars.ECS_WEB_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Verify deployed release and public contracts
        env:
          INTENDED_TASK_DEFINITION: ${{ steps.deploy-web.outputs.task-definition-arn }}
          WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
        run: |
          set -euo pipefail
          RUNNING_TASK_DEFINITION="$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${WEB_SERVICE}" --query 'services[0].taskDefinition' --output text)"
          if [[ -z "${INTENDED_TASK_DEFINITION}" ]]; then
            echo "Semantic smoke blocked: deployment action did not report the intended task definition" >&2
            exit 1
          fi
          if [[ "${INTENDED_TASK_DEFINITION}" != "${RUNNING_TASK_DEFINITION}" ]]; then
            echo "Semantic smoke blocked: intended task definition is not serving" >&2
            exit 1
          fi
          node scripts/smoke-public-contracts.mjs --base-url "${BASE_URL}" --phase final --output deployed-public-contract-receipt.json

      - name: Retain deployed semantic-smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: deployed-public-contracts-${{ github.sha }}
          path: deployed-public-contract-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Render detector task definition
        id: render-detector
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_DETECTOR_TASK_DEFINITION_FAMILY }}
          container-name: detector
          image: ${{ steps.detector-image.outputs.image }}

      - name: Deploy detector service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-detector.outputs.task-definition }}
          service: ${{ vars.ECS_DETECTOR_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

  publish-production-ota:
    name: Publish production OTA
    needs: validate-build-deploy
    # publish only after the full production deployment succeeds
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/publish-ota.yml
    with:
      channel: production
    secrets: inherit
