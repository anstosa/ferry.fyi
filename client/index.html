<!DOCTYPE html>
<html class="h-full" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title data-seo-seed="true">%APP_TITLE%</title>
    <meta data-seo-seed="true" name="description" content="%APP_DESCRIPTION%" />
    <meta data-seo-seed="true" name="robots" content="index,follow" />
    <link data-seo-seed="true" vite-ignore rel="canonical" href="%SEO_BASE_URL%" />
    <link rel="icon" href="/static/images/favicon.ico" sizes="any" />
    <link
      rel="icon"
      href="/static/images/favicon-32x32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="/static/images/favicon-16x16.png"
      sizes="16x16"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      href="/static/images/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      media="print"
      onload="this.media='all'"
      rel="stylesheet"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FerryFYI" />
    <meta data-seo-seed="true" name="twitter:title" content="%APP_TITLE%" />
    <meta data-seo-seed="true" name="twitter:description" content="%APP_DESCRIPTION%" />
    <meta vite-ignore name="twitter:image" content="%SOCIAL_IMAGE%" />
    <meta name="twitter:image:alt" content="Ferry FYI ferry schedule and tracker" />

    <meta data-seo-seed="true" property="og:url" content="%SEO_BASE_URL%" />
    <meta property="og:type" content="website" />
    <meta data-seo-seed="true" property="og:title" content="%APP_TITLE%" />
    <meta data-seo-seed="true" property="og:description" content="%APP_DESCRIPTION%" />
    <meta vite-ignore property="og:image" content="%SOCIAL_IMAGE%" />
    <meta property="og:image:alt" content="Ferry FYI ferry schedule and tracker" />

    <meta data-seo-seed="true" itemprop="name" content="%APP_TITLE%" />
    <meta data-seo-seed="true" itemprop="description" content="%APP_DESCRIPTION%" />
    <script data-seo-seed="true" id="structured-data" type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"Ferry FYI","url":"%SEO_BASE_URL%","description":"%APP_DESCRIPTION%"}
    </script>
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ferry FYI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  </head>
  <body class="h-full overflow-hidden">
    <div class="h-full flex flex-col" id="root">
      <div data-seo-seed="true" id="seo-content"></div>
      <div
        aria-label="Loading Ferry FYI"
        role="status"
        style="
          align-items: center;
          background: linear-gradient(135deg, #016f52 0%, #004d61 100%);
          color: #fff;
          display: flex;
          flex-direction: column;
          inset: 0;
          justify-content: center;
          position: fixed;
        "
      >
        <img
          alt="Ferry FYI"
          height="80"
          src="/static/images/icon_monochrome-256.png"
          style="display: block; width: 5rem;"
          width="80"
        />
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
