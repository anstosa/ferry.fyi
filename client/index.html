<!DOCTYPE html>
<html class="h-full" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, width=device-width"
    />

    <title>%APP_TITLE%</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <link vite-ignore rel="canonical" href="%BASE_URL%" />
    <link rel="icon" href="/static/images/favicon.ico" sizes="any" />
    <link
      rel="icon"
      href="/static/images/favicon-32x32.png"
      sizes="32x32"
      type="image/png"
    />
    <link
      rel="icon"
      href="/static/images/favicon-16x16.png"
      sizes="16x16"
      type="image/png"
    />
    <link
      rel="apple-touch-icon"
      href="/static/images/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FerryFYI" />
    <meta name="twitter:title" content="%APP_TITLE%" />
    <meta name="twitter:description" content="%APP_DESCRIPTION%" />
    <meta vite-ignore name="twitter:image" content="%SOCIAL_IMAGE%" />

    <meta property="og:url" content="%BASE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%APP_TITLE%" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta vite-ignore property="og:image" content="%SOCIAL_IMAGE%" />

    <meta itemprop="name" content="%APP_TITLE%" />
    <meta itemprop="description" content="%APP_DESCRIPTION%" />
    <meta vite-ignore itemprop="image" content="%SOCIAL_IMAGE%" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ferry FYI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link vite-ignore href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css" rel="stylesheet" />

    <!-- GTM:START -->
    <script>
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','%GTM_CONTAINER_ID%');
    </script>
    <!-- GTM:END -->
  </head>
  <body class="h-full overflow-hidden">
    <!-- GTM_NOSCRIPT:START -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=%GTM_CONTAINER_ID%"
        height="0"
        width="0"
        style="display:none;visibility:hidden"
      ></iframe>
    </noscript>
    <!-- GTM_NOSCRIPT:END -->

    <div class="h-full flex flex-col" id="root">
      <div
        aria-label="Loading Ferry FYI"
        role="status"
        style="
          align-items: center;
          background: linear-gradient(135deg, #016f52 0%, #004d61 100%);
          color: #fff;
          display: flex;
          flex-direction: column;
          inset: 0;
          justify-content: center;
          position: fixed;
        "
      >
        <img
          alt="Ferry FYI"
          src="/static/images/icon_monochrome.png"
          style="display: block; width: 5rem;"
        />
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
