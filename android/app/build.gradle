apply plugin: 'com.android.application'
// compile the native kotlin runtime
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'io.sentry.android.gradle'

// Upload release mappings when CI provides the Sentry token. The Capacitor
// plugin owns the SDK dependency, so the Gradle plugin is upload-only.
def sentryAuthToken = System.getenv('SENTRY_AUTH_TOKEN')
def canUploadSentryArtifacts = sentryAuthToken != null && !sentryAuthToken.isEmpty()
sentry {
    org = 'ferry-fyi'
    projectName = 'web'
    authToken = sentryAuthToken
    includeProguardMapping = true
    autoUploadProguardMapping = canUploadSentryArtifacts
    includeSourceContext = false
    autoUploadSourceContext = false
    telemetry = false
    autoInstallation {
        enabled = false
    }
    tracingInstrumentation {
        enabled = false
    }
}

// read local release credentials
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()

// load ignored signing values
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { input ->
        releaseSigningProperties.load(input)
    }
}

// require values before packaging
def requiredReleaseSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
tasks.register('verifyReleaseSigning') {
    doFirst {
        // stop unsigned release outputs
        if (!releaseSigningPropertiesFile.exists()) {
            throw new GradleException('Missing android/keystore.properties. Copy android/keystore.properties.example and add the upload-key values.')
        }

        requiredReleaseSigningProperties.each { propertyName ->
            // require every signing value
            if (!releaseSigningProperties.getProperty(propertyName)) {
                throw new GradleException("Missing ${propertyName} in android/keystore.properties.")
            }
        }
    }
}

tasks.configureEach { task ->
    // guard publishable release outputs
    if (task.name == 'packageRelease' || task.name == 'packageReleaseBundle') {
        task.dependsOn('verifyReleaseSigning')
    }
}

// CI supplies VERSION_CODE; local builds use the same generator as CI.
def configuredVersionCode = findProperty('VERSION_CODE')
def releaseVersionCode = (configuredVersionCode ?: providers.exec {
    commandLine 'bash', new File(rootProject.projectDir.parentFile, 'scripts/android-version-code.sh').absolutePath
}.standardOutput.asText.get().trim()).toInteger()
def releaseVersionName = findProperty('VERSION_NAME') ?: '2.8'
// This is an opt-in feasibility build only. It must never enable background work by default.
def backgroundLocationFeasibilityEnabled = providers.gradleProperty('backgroundLocationFeasibilityEnabled')
    .map { it.toBoolean() }
    .getOrElse(false)

android {
    namespace = "fyi.ferry"
    compileSdkVersion rootProject.ext.compileSdkVersion
    // default instrumentation to production-like debug; v0 is explicit only
    testBuildType providers.gradleProperty('automaticAndroidTestBuildType').getOrElse('debug')
    defaultConfig {
        applicationId "fyi.ferry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        buildConfigField 'boolean', 'BACKGROUND_LOCATION_FEASIBILITY_ENABLED', backgroundLocationFeasibilityEnabled.toString()
        buildConfigField 'boolean', 'AUTOMATIC_LEADERBOARD_V0_DIAGNOSTIC_ENABLED', 'false'
        buildConfigField 'boolean', 'AUTOMATIC_LEADERBOARD_N1_ENABLED', 'false'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            // configure only with local credentials
            if (releaseSigningPropertiesFile.exists()) {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        // define the explicit n1 capability build
        n1Capability {
            // expose the reviewed capability only through an explicit build
            initWith debug
            matchingFallbacks = ['debug']
            debuggable true
            buildConfigField 'boolean', 'AUTOMATIC_LEADERBOARD_N1_ENABLED', 'true'
        }
        // define the isolated v0 diagnostic build
        v0Diagnostic {
            // inherit local debug signing without changing normal debug builds
            initWith debug
            matchingFallbacks = ['debug']
            debuggable true
            buildConfigField 'boolean', 'AUTOMATIC_LEADERBOARD_V0_DIAGNOSTIC_ENABLED', 'true'
        }
        release {
            // apply the configured upload key
            if (releaseSigningPropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            // Enable R8 for publishable builds to reduce code and resource size.
            minifyEnabled true
            shrinkResources true
            // Preserve a compact native symbol table in the App Bundle for Play Console crash reports.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // satisfy the tracked capacitor host layout explicitly
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // compile the reviewed but default-off n1 runtime
    implementation "androidx.work:work-runtime:2.10.1"
    // observe durable workmanager enqueue acceptance
    implementation "com.google.guava:guava:33.6.0-android"
    // reuse one bounded geofence and one-shot location sdk
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // reuse the location sdk already selected by the capacitor geolocation plugin
    v0DiagnosticImplementation "com.google.android.gms:play-services-location:21.3.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    // optional firebase
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
